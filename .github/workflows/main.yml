name: Build Trading Alerts APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract v2.3 bundle if uploaded as zip
        run: |
          if [ -f TradingAlerts-v2.3-Android.zip ]; then
            rm -rf core app gradle
            python3 -c "import zipfile; zipfile.ZipFile('TradingAlerts-v2.3-Android.zip').extractall('.')"
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2

      - name: Run core unit tests
        run: gradle :core:test --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Package TradingAlerts.apk
        run: |
          mkdir -p dist
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          cp "$APK_PATH" dist/TradingAlerts.apk
          ls -lh dist/TradingAlerts.apk

      - name: Upload TradingAlerts.apk
        uses: actions/upload-artifact@v4
        with:
          name: TradingAlerts-apk
          path: dist/TradingAlerts.apk