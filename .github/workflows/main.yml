name: Build & Test Trading Alerts (LRMLC)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Lint, Unit Tests & Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
            packages: ''

      - name: Set up Gradle (pinned 8.9)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run Android Lint
        run: gradle lintDebug --no-daemon

      - name: Run Unit Tests
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TradingAlerts-LRMLC-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Test Reports (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

      # ------------------------------------------------------------------
      # Optional Signed Release APK Step
      # To enable, add the following repository secrets in GitHub Settings:
      #   ANDROID_KEYSTORE_BASE64  (base64-encoded .jks/.keystore file)
      #   KEYSTORE_PASSWORD
      #   KEY_ALIAS
      #   KEY_PASSWORD
      # Then uncomment the steps below:
